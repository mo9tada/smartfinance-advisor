<div class="bg-white border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-white">
      <thead class="bg-white/50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Matricule</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">User</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Role</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Last Login</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-black uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-white bg-white">
        <tr *ngFor="let user of users()">
          <td class="px-6 py-4 whitespace-nowrap">
            <span
              class="text-xs font-mono font-bold text-red-500 px-2 py-1 bg-red-500/10 rounded border border-red-500/20">
              {{ user.matricule }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-black">{{ user.full_name }}</div>
            <div class="text-xs text-black">{{ user.email }}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="text-xs text-black capitalize">{{ user.role }}</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-xs text-black">
            {{ user.last_login ? (user.last_login | date:'short') : 'Never' }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
            <button (click)="startEdit(user)" class="text-gray-400 hover:text-blue-500 transition-colors">Edit</button>
            <button (click)="deleteUser(user.id)"
              class="text-gray-400 hover:text-red-500 transition-colors">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Inline Edit Modal/Overaly (Simplified) -->
  <div *ngIf="editingUser()"
    class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-xl font-bold text-white mb-6">Edit User Account</h3>

      <form [formGroup]="editForm" (ngSubmit)="saveEdit()" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase mb-1">First Name</label>
            <input formControlName="first_name" type="text"
              class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Last Name</label>
            <input formControlName="last_name" type="text"
              class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Email</label>
          <input formControlName="email" type="email"
            class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Role</label>
          <select formControlName="role"
            class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="viewer">Viewer</option>
            <option value="analyst">Analyst</option>
            <option value="administrator">Administrator</option>
          </select>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-800 mt-6">
          <button type="button" (click)="cancelEdit()"
            class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
          <button type="submit" [disabled]="editForm.invalid"
            class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
