<div class="bg-white border border-gray-800 rounded-2xl overflow-hidden shadow-md">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-white">
      <thead class="bg-white/50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Contact</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Role</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-black uppercase tracking-wider">Requested On</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-black uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-white bg-white">
        <tr *ngFor="let user of users()" class="hover:bg-red-800/10 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-black">{{ user.first_name }} {{ user.last_name }}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm text-black">{{ user.email }}</div>
            <div class="text-xs text-black">{{ user.phone }}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span
              class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-900/30 text-blue-400 border border-blue-500/30 capitalize">
              {{ user.role }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-black">
            {{ user.created_at | date:'mediumDate' }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
            <button (click)="accept(user.id)" [disabled]="actionInProgress() === user.id"
              class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-white bg-blue-600 hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 transition-colors">
              {{ actionInProgress() === user.id ? '...' : 'Accept' }}
            </button>
            <button (click)="reject(user.id)" [disabled]="actionInProgress() === user.id"
              class="inline-flex items-center px-3 py-1.5 border border-gray-700 text-xs font-medium rounded-md text-gray-300 bg-transparent hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 disabled:opacity-50 transition-colors">
              {{ actionInProgress() === user.id ? '...' : 'Reject' }}
            </button>
          </td>
        </tr>

        <tr *ngIf="users().length === 0 && !isLoading()">
          <td colspan="5" class="px-6 py-12 text-center text-black italic">
            No pending registration requests.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="isLoading()" class="py-12 flex justify-center items-center">
    <div class="h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
  </div>
</div>
