<div class="min-h-screen bg-[#f5f5f7] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex flex-col items-center mb-6">
      <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-lg mb-4">
        <svg viewBox="0 0 24 24" class="w-10 h-10 text-[#e30613] px-1" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="text-3xl font-extrabold text-[#1d1d1f] tracking-tight">Reset Password</h2>
      
      <!-- Step Indicators -->
      <div class="mt-4 flex items-center justify-center space-x-3">
        <div [class]="'h-1.5 w-10 rounded-full transition-all ' + (step() >= 1 ? 'bg-[#e30613]' : 'bg-[#e5e5ea]')"></div>
        <div [class]="'h-1.5 w-10 rounded-full transition-all ' + (step() >= 2 ? 'bg-[#e30613]' : 'bg-[#e5e5ea]')"></div>
        <div [class]="'h-1.5 w-10 rounded-full transition-all ' + (step() >= 3 ? 'bg-[#e30613]' : 'bg-[#e5e5ea]')"></div>
      </div>
    </div>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="apple-card py-10 px-4 sm:px-10">
      
      <!-- Step 1: Email -->
      <form *ngIf="step() === 1" [formGroup]="emailForm" (ngSubmit)="sendCode()" class="space-y-6 animate-fade-in">
        <p class="text-[14px] text-[#86868b] text-center leading-relaxed">Enter your email and we'll send you a 6-digit verification code.</p>
        <div>
          <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Email Address</label>
          <input formControlName="email" type="email" required
            class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
        </div>
        <button type="submit" [disabled]="emailForm.invalid || isLoading()"
          class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-[15px] font-bold rounded-[12px] text-white bg-[#e30613] hover:bg-[#c90010] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#e30613] disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md">
          {{ isLoading() ? 'Sending...' : 'Send Code' }}
        </button>
      </form>

      <!-- Step 2: OTP -->
      <form *ngIf="step() === 2" [formGroup]="codeForm" (ngSubmit)="verifyCode()" class="space-y-6 animate-fade-in">
        <p class="text-[14px] text-[#86868b] text-center leading-relaxed">We sent a 6-digit code to <strong class="text-[#1d1d1f]">{{ emailForm.value.email }}</strong></p>
        <div>
            <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Verification Code</label>
            <input formControlName="code" type="text" maxlength="6" placeholder="123456"
              class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all text-center tracking-[0.5em] text-2xl font-bold">
        </div>
        <button type="submit" [disabled]="codeForm.invalid || isLoading()"
          class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-[15px] font-bold rounded-[12px] text-white bg-[#e30613] hover:bg-[#c90010] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#e30613] disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md">
          {{ isLoading() ? 'Verifying...' : 'Verify Code' }}
        </button>
        <button type="button" (click)="step.set(1)" class="w-full text-[13px] font-semibold text-[#e30613] hover:text-[#c90010] transition-colors mt-2">Change Email</button>
      </form>

      <!-- Step 3: New Password -->
      <form *ngIf="step() === 3" [formGroup]="passwordForm" (ngSubmit)="resetPassword()" class="space-y-6 animate-fade-in">
        <div>
          <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">New Password</label>
          <input formControlName="password" type="password"
            class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Confirm Password</label>
          <input formControlName="confirmPassword" type="password"
            class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
        </div>
        <button type="submit" [disabled]="passwordForm.invalid || isLoading()"
          class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-[15px] font-bold rounded-[12px] text-white bg-[#e30613] hover:bg-[#c90010] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#e30613] disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md">
          {{ isLoading() ? 'Updating...' : 'Set New Password' }}
        </button>
      </form>

      <div *ngIf="errorMessage()" class="mt-6 p-4 rounded-[12px] bg-red-50 border border-red-100 text-red-600 text-sm text-center font-medium animate-fade-in">
          {{ errorMessage() }}
      </div>

      <div class="mt-8 pt-6 border-t border-black/[0.05] text-center">
        <a routerLink="/login" class="text-[14px] text-[#86868b]">
          Back to <span class="text-[#e30613] font-bold hover:text-[#c90010] transition-colors ml-1">Log in</span>
        </a>
      </div>
    </div>
  </div>
</div>
