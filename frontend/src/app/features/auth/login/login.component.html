<div class="min-h-screen bg-[#f5f5f7] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- App Logo & Title -->
    <div class="flex flex-col items-center mb-10">
      <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-lg mb-4">
        <svg viewBox="0 0 24 24" class="w-10 h-10 text-[#e30613] px-1" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="text-4xl font-extrabold text-[#1d1d1f] tracking-tight">Advisor</h2>
      <p class="mt-2 text-sm text-[#86868b]">Smart Finance Analytics Dashboard</p>
    </div>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="apple-card py-10 px-4 sm:px-10">
      <div class="mb-8 text-center">
        <h3 class="text-2xl font-bold text-[#1d1d1f]">Sign In</h3>
        <p class="text-[14px] text-[#86868b] mt-2">Enter your credentials to access the platform.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="matricule" class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Matricule</label>
          <div class="relative">
            <input id="matricule" formControlName="matricule" type="text" placeholder="SFA-XXXX" required
              class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-mono text-[15px]">
          </div>
          <div *ngIf="loginForm.get('matricule')?.touched && loginForm.get('matricule')?.invalid" class="mt-2 text-xs text-red-500 font-medium px-1">
            Matricule is required.
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em]">Password</label>
            <a routerLink="/forgot-password" class="text-[13px] font-semibold text-[#e30613] hover:text-[#c90010] transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="password" formControlName="password" type="password" placeholder="********" required
              class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all text-[15px]">
          </div>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="mt-2 text-xs text-red-500 font-medium px-1">
            Password is required (min 6 characters).
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" [disabled]="loginForm.invalid || isLoading()"
            class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-[15px] font-bold rounded-[12px] text-white bg-[#e30613] hover:bg-[#c90010] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#e30613] disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md">
            <span *ngIf="!isLoading()">Sign In</span>
            <div *ngIf="isLoading()" class="h-5 w-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </div>

        <div *ngIf="errorMessage()" class="mt-6 p-4 rounded-[12px] bg-red-50 border border-red-100 text-red-600 text-sm text-center font-medium animate-fade-in">
          {{ errorMessage() }}
        </div>
      </form>

      <div class="mt-8 pt-6 border-t border-black/[0.05] text-center">
        <p class="text-[14px] text-[#86868b]">
          Don't have an account? 
          <a routerLink="/register" class="font-bold text-[#e30613] hover:text-[#c90010] transition-colors ml-1">Request Access</a>
        </p>
      </div>
    </div>
  </div>
</div>
