<div class="min-h-screen bg-[#f5f5f7] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-6">
    <div class="flex justify-center mb-6">
      <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-lg">
        <svg viewBox="0 0 24 24" class="w-10 h-10 text-[#e30613] px-1" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <h2 class="text-3xl font-extrabold text-[#1d1d1f] tracking-tight">
      Request Access
    </h2>
    <p class="mt-2 text-sm text-[#86868b]">
      Submit your details for administrator approval
    </p>
  </div>

  <div class="mt-4 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="apple-card py-10 px-4 sm:px-10">
      
      <div *ngIf="isSuccess()" class="text-center space-y-4 py-8 animate-fade-in">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-50 border-2 border-green-500 shadow-sm">
          <svg class="h-8 w-8 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h3 class="text-xl font-bold text-[#1d1d1f]">Submission Successful</h3>
        <p class="text-[14px] text-[#86868b] leading-relaxed">
          Your request has been received. You will receive an email with your credentials once an administrator approves your account.
        </p>
        <div class="pt-6">
          <a routerLink="/login" class="inline-block px-6 py-2.5 bg-[#e30613]/10 text-[#e30613] font-bold rounded-xl hover:bg-[#e30613]/20 transition-colors">
            Back to login
          </a>
        </div>
      </div>

      <form *ngIf="!isSuccess()" [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5 animate-fade-in">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">First Name</label>
            <input formControlName="first_name" type="text"
              class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Last Name</label>
            <input formControlName="last_name" type="text"
              class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Email Address</label>
          <input formControlName="email" type="email"
            class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
        </div>

        <div>
           <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Phone (Optional)</label>
          <input formControlName="phone" type="text"
            class="appearance-none block w-full px-4 py-3 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] placeholder:text-black/30 focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium text-[15px]">
        </div>

        <div>
           <label class="block text-[11px] font-bold text-[#86868b] uppercase tracking-[0.05em] mb-2">Desired Role</label>
           <div class="relative">
             <select formControlName="role"
               class="appearance-none block w-full px-4 py-3 pr-10 border border-black/[0.05] rounded-[12px] bg-black/[0.02] text-[#1d1d1f] focus:outline-none focus:ring-2 focus:ring-[#e30613]/30 focus:border-[#e30613]/30 transition-all font-medium cursor-pointer text-[15px]">
               <option value="viewer">Viewer (Read-only)</option>
               <option value="analyst">Analyst (Full dashboard access)</option>
             </select>
             <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#86868b]">
               <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
               </svg>
             </div>
           </div>
        </div>

        <div *ngIf="errorMessage()" class="p-4 rounded-[12px] bg-red-50 border border-red-100 text-red-600 text-sm text-center font-medium animate-fade-in">
          {{ errorMessage() }}
        </div>

        <div class="pt-4">
          <button type="submit" [disabled]="registerForm.invalid || isLoading()"
            class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-[15px] font-bold rounded-[12px] text-white bg-[#e30613] hover:bg-[#c90010] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#e30613] disabled:opacity-50 transition-all shadow-md">
            <span *ngIf="isLoading()" class="flex items-center">
              <div class="h-5 w-5 border-2 border-white/30 border-t-white rounded-full animate-spin mr-2"></div>
              Submitting...
            </span>
            <span *ngIf="!isLoading()">Request Account</span>
          </button>
        </div>

        <div class="mt-8 pt-6 border-t border-black/[0.05] text-center">
          <a routerLink="/login" class="text-[14px] text-[#86868b]">
            Already have an account? <span class="text-[#e30613] font-bold hover:text-[#c90010] transition-colors ml-1">Log in</span>
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
