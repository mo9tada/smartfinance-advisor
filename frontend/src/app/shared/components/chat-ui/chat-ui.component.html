<div class="flex h-screen bg-[#f5f5f7]">
  
    <!-- Left Sidebar -->
    <div class="w-72 bg-white/80 backdrop-blur-2xl border-r border-black/5 flex flex-col shadow-sm z-10 relative">
      <!-- Header -->
      <div class="p-6 border-b border-black/5">
        <button (click)="goBack()" class="flex items-center gap-2 text-sm text-[#86868b] hover:text-black transition-colors mb-6">
          <svg class="w-4 h-4 shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to Dashboard
        </button>
  
        <button (click)="startNewChat()" class="w-full flex items-center justify-center gap-2 bg-black text-white rounded-xl py-3 px-4 font-semibold text-sm hover:scale-[1.02] shadow-sm transition-transform duration-300">
          <svg class="w-4 h-4 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          New Chat
        </button>

        <div class="mt-4 bg-black/5 p-1 rounded-xl flex items-center shadow-inner">
          <button (click)="mode !== 'analyst' && switchMode()" 
                  [ngClass]="mode === 'analyst' ? 'bg-white shadow-sm text-black' : 'text-[#86868b] hover:text-black'" 
                  class="flex-1 py-2 text-[13px] font-semibold rounded-lg transition-all">Analyst</button>
          <button (click)="mode !== 'finance' && switchMode()" 
                  [ngClass]="mode === 'finance' ? 'bg-white shadow-sm text-black' : 'text-[#86868b] hover:text-black'" 
                  class="flex-1 py-2 text-[13px] font-semibold rounded-lg transition-all">Finance</button>
        </div>
      </div>
  
      <!-- History List -->
      <div class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
        <p class="text-[10px] font-bold text-[#86868b] uppercase tracking-widest pl-2 mb-2">Previous Chats</p>
        <div *ngFor="let session of sessions; trackBy: trackBySession" class="group flex items-center gap-2 w-full rounded-xl px-3 py-2 text-sm transition-colors hover:bg-black/5">
          <button (click)="selectSession(session.id)" class="flex-1 text-left truncate text-[#1d1d1f]">
            {{ session.title }}
          </button>
          <button (click)="$event.stopPropagation(); renameSession(session)" class="opacity-0 group-hover:opacity-100 text-[#86868b] hover:text-black transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 20h9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button (click)="$event.stopPropagation(); deleteSession(session)" class="opacity-0 group-hover:opacity-100 text-[#86868b] hover:text-[#e30613] transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
  
      <!-- Bottom User Section -->
      <div class="p-4 border-t border-black/5 bg-white/50">
        <div class="flex items-center justify-between px-2">
            <span class="text-sm font-semibold truncate">{{ authService.currentUser()?.email || 'User' }}</span>
            <button (click)="logout()" class="text-[#86868b] hover:text-[#e30613] p-2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
      </div>
    </div>
  
    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col relative bg-transparent">
        
      <!-- Top header branding -->
      <div class="h-16 border-b border-black/5 flex items-center justify-center bg-white/40 backdrop-blur-md sticky top-0 z-10 w-full shadow-sm">
        <span class="font-bold tracking-tight text-[#1d1d1f] bg-clip-text text-transparent"
              [ngClass]="mode === 'analyst' ? 'bg-gradient-to-r from-blue-600 to-purple-600' : 'bg-gradient-to-r from-emerald-600 to-teal-800'">
            Lexa — {{ mode === 'analyst' ? 'Data Analyst' : 'Finance & Law' }} Assistant
        </span>
      </div>
  
      <!-- Messages Thread -->
      <div #messageList class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 pb-40 flex flex-col items-center">
          
        <!-- Empty State -->
        <div *ngIf="messages.length === 0" class="flex flex-col items-center justify-center flex-1 w-full max-w-3xl mt-12 mb-8 animate-fade-in">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr flex items-center justify-center shadow-lg mb-6"
               [ngClass]="mode === 'analyst' ? 'from-indigo-500 to-purple-600' : 'from-emerald-500 to-teal-700'">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
          </div>
          <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r" [ngClass]="mode === 'analyst' ? 'from-black to-gray-500' : 'from-black to-emerald-900'">How can I help you today?</h2>
          
          <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-4 w-full px-4">
            <button *ngFor="let prompt of suggestedPrompts" (click)="sendMessage(prompt)"
                    class="p-4 rounded-xl border border-black/10 bg-white shadow-sm hover:shadow-md hover:border-black/20 text-left transition-all group flex flex-col justify-between h-full min-h-[100px]">
              <span class="text-sm font-medium text-[#1d1d1f] group-hover:text-blue-600">{{ prompt }}</span>
              <svg class="w-4 h-4 text-[#86868b] self-end group-hover:text-blue-600 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
  
        <!-- Messages List -->
        <div class="w-full max-w-3xl space-y-6 flex flex-col items-center">
            <div *ngFor="let msg of messages; trackBy: trackByMessage" class="w-full animate-fade-in flex flex-col" [ngClass]="msg.role === 'user' ? 'items-end' : 'items-start'">
                
            <div class="flex items-start gap-4 max-w-[85%] relative">
                <!-- Avatar Assistant -->
                <div *ngIf="msg.role === 'assistant'" class="w-8 h-8 shrink-0 rounded-lg bg-gradient-to-tr flex items-center justify-center mt-1 z-10" [ngClass]="mode === 'analyst' ? 'from-indigo-500 to-purple-600' : 'from-emerald-500 to-teal-700'">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                
                <!-- Bubble -->
                <div class="px-5 py-3.5 rounded-2xl text-[15px] shadow-sm leading-relaxed tracking-tight"
                    [ngClass]="msg.role === 'user' ? 'bg-[#18181b] text-white rounded-tr-sm' : 'bg-white border border-black/5 text-[#1d1d1f] rounded-tl-sm'">
                    
                    <span *ngIf="msg.isLoading" class="flex gap-1.5 h-6 items-center px-1">
                      <span class="w-1.5 h-1.5 bg-black/40 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                      <span class="w-1.5 h-1.5 bg-black/40 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                      <span class="w-1.5 h-1.5 bg-black/40 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                    </span>
                    
                    <span *ngIf="!msg.isLoading">{{ msg.content }}</span>
                </div>
            </div>
    
            <!-- Sources -->
            <div *ngIf="msg.sources?.length && !msg.isLoading" class="mt-2 ml-12 px-1 flex flex-wrap gap-2 animate-fade-in">
                <span class="text-xs font-semibold text-[#86868b]">Sources:</span>
                <span *ngFor="let source of msg.sources" class="px-2 py-0.5 rounded-md bg-white border border-black/5 shadow-sm text-[11px] text-[#424245] flex items-center gap-1 cursor-pointer hover:bg-black/5 transition-colors">
                    <svg class="w-3 h-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    {{ source }}
                </span>
            </div>
    
            </div>
        </div>
      </div>
  
      <!-- Input Area -->
      <div class="sticky bottom-0 left-0 right-0 p-4 md:p-6 bg-gradient-to-t from-[#f5f5f7] via-[#f5f5f7] to-transparent pb-8">
        <div class="max-w-3xl mx-auto backdrop-blur-2xl bg-white/70 shadow-lg border border-black/10 rounded-2xl relative transition-all focus-within:bg-white focus-within:shadow-xl focus-within:border-black/20">
          <textarea 
            [(ngModel)]="userInput"
            (keydown.enter)="sendMessage(); $event.preventDefault()"
            class="w-full bg-transparent px-4 py-4 pr-12 min-h-[56px] max-h-32 resize-none focus:outline-none text-[15px] font-medium text-[#1d1d1f] placeholder:text-[#86868b] placeholder:font-normal custom-scrollbar" 
            placeholder="Ask Lexa anything... (Shift+Enter for newline, Enter to send)"
            rows="1">
          </textarea>
          
          <button (click)="sendMessage()" [disabled]="!userInput.trim()" class="absolute right-3 bottom-3 p-1.5 rounded-xl transition-all" [ngClass]="userInput.trim() ? 'bg-black text-white shadow-md hover:scale-110' : 'bg-black/5 text-[#86868b]'">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="text-center text-[11px] text-[#86868b] mt-3 font-medium tracking-wide">Lexa can make mistakes. Consider verifying important metrics.</p>
      </div>
  
    </div>
  </div>
